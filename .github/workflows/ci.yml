name: CaveBettor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cavebettor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate build, assets and static delivery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check asset uniqueness
        run: npm run assets:unique

      - name: Verify built assets
        run: npm run assets:check

      - name: Type and Svelte check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          GIT_COMMIT: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}

      - name: Verify static pages exist
        run: npm run verify:static

  deploy:
    name: Deploy to Cloudflare
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GIT_COMMIT: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
          NODE_ENV: production

      - name: Publish the Worker with static assets
        run: npx wrangler deploy --config wrangler.worker.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify the production deployment
        run: npm run production:verify
        env:
          PRODUCTION_URL: https://cavebettor.ewinproject.org
