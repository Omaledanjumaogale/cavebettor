name: CaveBettor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cavebettor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate build, assets and static delivery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check asset uniqueness
        run: npm run assets:unique

      - name: Verify built assets
        run: npm run assets:check

      - name: PWA contract (manifest, worker, icons, ecosystem descriptor)
        run: npm run pwa:verify

      - name: Type and Svelte check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Market board audit
        run: npm run audit:markets

      - name: Build
        run: npm run build
        env:
          GIT_COMMIT: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}

      - name: Verify static pages exist
        run: npm run verify:static

  deploy:
    name: Deploy to Cloudflare
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Publishing must never silently skip: a green validation run with a
      # stale production site is worse than a red deploy job.
      #   gh secret set CLOUDFLARE_API_TOKEN --body "<token with Workers Scripts: Edit>"
      #   gh secret set CLOUDFLARE_ACCOUNT_ID --body "04ca38ff81dd0f1c0cdf584db3779aee"
      - name: Require deploy credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error title=Deploy blocked::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be set."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: npm ci

      - name: Build
        if: steps.creds.outputs.ready == 'true'
        run: npm run build
        env:
          GIT_COMMIT: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
          NODE_ENV: production

      - name: Publish the Worker with static assets
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler deploy --config wrangler.worker.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify the production deployment
        if: steps.creds.outputs.ready == 'true'
        run: npm run production:verify
        env:
          PRODUCTION_URL: https://cavebettor.ewinproject.org
          EXPECTED_COMMIT: ${{ github.sha }}
