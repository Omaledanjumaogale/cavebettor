<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="%sveltekit.assets%/icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070d0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f7f3" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <!-- Installable web app (Android / Chromium). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="CaveBettor" />
    <!-- Installable web app (iOS reads these instead of the manifest). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CaveBettor" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      (() => {
        try {
          const saved = localStorage.getItem('cb_theme');
          const theme = saved === 'light' ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.classList.toggle('light', theme === 'light');
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <meta
      name="description"
      content="CaveBettor — harmonised sports prediction, odds intelligence and bankroll analytics for football, basketball, tennis, ice hockey and baseball. Naira-first, model-led, bookmaker-aware."
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="tap">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
